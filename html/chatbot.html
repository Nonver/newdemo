<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>健康风险评估师 - AI对话原型</title>
<style>
:root {
  --primary: #FF6B35; --primary-hover: #E55A2B; --primary-light: #FFF0EB;
  --risk-0: #34C759; --risk-1: #1677FF; --risk-2: #FF9500; --risk-3: #FF6B35; --risk-4: #FF3B30;
  --risk-0-bg: #E8F9ED; --risk-1-bg: #E8F0FF; --risk-2-bg: #FFF5E6; --risk-3-bg: #FFF0EB; --risk-4-bg: #FFEDED;
  --bg: #FAF6F3; --chat-bg: #F5EDE8; --card-bg: #FFFFFF; --ai-bubble: #FFFFFF; --user-bubble: #FF6B35;
  --text: #2D2420; --text-secondary: #5A4A42; --text-muted: #9A8A82; --border: #F0E8E3; --divider: #F5EDE8;
  --radius-xl: 28px; --radius-lg: 20px; --radius-md: 16px; --radius-sm: 12px; --radius-xs: 8px;
  --container-w: 430px; --header-h: 56px; --input-h: 64px;
  --shadow-card: 0 2px 12px rgba(255,107,53,0.08); --shadow-bubble: 0 1px 4px rgba(0,0,0,0.04);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 14px; color: var(--text); background: #E8E0DC; line-height: 1.6;
  display: flex; justify-content: center; min-height: 100vh;
}
.app-container {
  width: var(--container-w); max-width: 100vw; height: 100vh;
  background: var(--chat-bg); display: flex; flex-direction: column;
  position: relative; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.08);
}
/* ===== Header ===== */
.app-header {
  height: var(--header-h); background: var(--card-bg);
  border-bottom: 1px solid var(--divider); display: flex;
  align-items: center; justify-content: space-between;
  padding: 0 16px; flex-shrink: 0; z-index: 10;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-logo {
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, #FF6B35, #FF8C5A);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.header-title-main { font-size: 16px; font-weight: 600; color: var(--text); }
.header-title-sub { font-size: 11px; color: var(--text-muted); }
.header-elderly {
  display: flex; align-items: center; gap: 4px; cursor: pointer;
  padding: 6px 12px; border-radius: var(--radius-md);
  background: var(--primary-light); transition: background 0.2s;
}
.header-elderly:hover { background: rgba(255,107,53,0.15); }
.header-elderly-name { font-size: 14px; font-weight: 500; color: var(--primary); }
.header-elderly svg { width: 14px; height: 14px; color: var(--primary); }
.header-entry-mode {
  font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 6px;
  font-weight: 500; white-space: nowrap;
}
.header-entry-mode.archive { background: #E8F0FF; color: #1677FF; }
.header-entry-mode.dialog { background: #FFF0EB; color: var(--primary); }
/* ===== Chat Area ===== */
.chat-area {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 12px 0; -webkit-overflow-scrolling: touch;
}
.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
/* ===== Message Rows ===== */
.message-row { display: flex; margin: 8px 16px; gap: 8px; align-items: flex-end; }
.message-row.ai { justify-content: flex-start; }
.message-row.user { justify-content: flex-end; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.avatar.ai { background: linear-gradient(135deg, #FF6B35, #FF8C5A); color: #fff; }
.avatar.user { background: var(--divider); color: var(--text-secondary); }
.bubble {
  max-width: 75%; padding: 10px 14px; border-radius: var(--radius-lg);
  font-size: 14px; line-height: 1.6; word-break: break-word; box-shadow: var(--shadow-bubble);
}
.bubble.ai { background: var(--ai-bubble); color: var(--text); border-bottom-left-radius: 6px; }
.bubble.user { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 6px; }
.bubble.ai br { display: block; }
/* ===== Typing Indicator ===== */
.typing-indicator { display: flex; gap: 4px; padding: 4px 0; }
.typing-indicator .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted);
  animation: typingDot 1.4s infinite;
}
.typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingDot {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}
/* ===== Card Messages ===== */
.card-message {
  max-width: 92%; margin: 8px 16px 8px 60px;
  background: var(--card-bg); border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card); overflow: hidden;
  animation: cardSlideIn 0.4s ease;
}
@keyframes cardSlideIn {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.card-header {
  padding: 14px 20px 10px; display: flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 600; color: var(--text);
  border-bottom: 1px solid var(--divider);
}
.card-header svg { width: 18px; height: 18px; color: var(--primary); flex-shrink: 0; }
.card-body { padding: 16px 20px 20px; }
.ai-disclaimer {
  background: linear-gradient(135deg, #FFF8F0 0%, #FFF0E0 100%);
  border-left: 3px solid var(--primary);
  padding: 8px 12px;
  margin-bottom: 12px;
  border-radius: var(--radius-xs);
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
  line-height: 1.5;
}
.ai-tag {
  background: var(--primary);
  color: #fff;
  padding: 1px 6px;
  border-radius: var(--radius-xs);
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
}
/* ===== Risk Overview Card ===== */
.risk-badge-large {
  border-radius: var(--radius-lg); padding: 20px; text-align: center;
  margin-bottom: 12px; color: #fff;
}
.risk-badge-large .risk-label { font-size: 22px; font-weight: 700; display: block; margin-bottom: 4px; }
.risk-badge-large .risk-score { font-size: 32px; font-weight: 800; }
.risk-badge-large .risk-score small { font-size: 16px; font-weight: 400; opacity: 0.8; }
.risk-progress-bar {
  height: 8px; background: var(--divider); border-radius: 4px;
  overflow: hidden; margin-bottom: 12px;
}
.progress-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
.risk-conclusion { font-size: 14px; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.6; }
.section-label {
  font-size: 12px; color: var(--text-muted); font-weight: 600;
  margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.5px;
}
.scene-tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.scene-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: var(--radius-xs);
  background: var(--primary-light); color: var(--primary);
  font-size: 12px; font-weight: 500;
}
.scene-tag .weight { color: var(--text-muted); font-size: 11px; }
.report-info-row { display: flex; flex-direction: column; gap: 4px; }
.report-info-item { display: flex; justify-content: space-between; font-size: 12px; }
.report-info-item .label { color: var(--text-muted); }
.report-info-item .value { color: var(--text-secondary); font-weight: 500; }
.card-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.card-btn {
  padding: 6px 14px; border-radius: var(--radius-md); border: 1px solid var(--border);
  background: var(--card-bg); color: var(--text-secondary); font-size: 13px;
  cursor: pointer; transition: all 0.2s;
}
.card-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
/* ===== Indicator Detail Card ===== */
.indicator-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.indicator-cell {
  background: var(--bg); border-radius: var(--radius-md);
  padding: 10px 6px; text-align: center;
}
.indicator-cell .ind-name { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
.indicator-cell .ind-value { font-size: 15px; font-weight: 600; color: var(--text); }
.indicator-cell .ind-status {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 11px; font-weight: 500; margin-top: 3px;
}
.indicator-cell .ind-status-dot { width: 6px; height: 6px; border-radius: 50%; }
.indicator-cell.abnormal { background: var(--risk-2-bg); }
.indicator-cell.abnormal .ind-value { color: var(--risk-3); }
.indicator-cell.abnormal .ind-status { color: var(--risk-3); }
.indicator-cell.abnormal .ind-status-dot { background: var(--risk-3); }
.indicator-cell.normal .ind-status { color: var(--risk-0); }
.indicator-cell.normal .ind-status-dot { background: var(--risk-0); }
.indicator-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
/* ===== 结构化舌诊详情网格 ===== */
.tongue-detail-grid { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.td-item { background: var(--bg); border-radius: var(--radius-md); padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
.td-label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
.td-value { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
/* 报告总览卡片中指标行（定性值无进度条） */
.risk-indicator-value { font-size: 13px; font-weight: 600; min-width: 50px; }
.score-detail { background: var(--bg); border-radius: var(--radius-md); padding: 12px; margin-bottom: 12px; }
.score-detail-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
.score-detail-row .label { color: var(--text-muted); }
.score-detail-row .value { color: var(--text); font-weight: 500; }
.score-detail-row.total { border-top: 1px solid var(--divider); margin-top: 4px; padding-top: 6px; }
.score-detail-row.total .value { font-size: 16px; font-weight: 700; color: var(--primary); }
.dimension-conclusion {
  font-size: 13px; color: var(--text-secondary); line-height: 1.6;
  background: var(--bg); padding: 10px 12px; border-radius: var(--radius-md);
}
/* ===== Care Advice Card ===== */
.advice-group { margin-bottom: 14px; }
.advice-group:last-child { margin-bottom: 0; }
.advice-group-title {
  font-size: 14px; font-weight: 600; color: var(--text);
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.advice-group-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.advice-list { list-style: none; }
.advice-list li {
  position: relative; padding-left: 18px; font-size: 13px;
  color: var(--text-secondary); line-height: 1.8;
}
.advice-list li::before {
  content: ""; position: absolute; left: 4px; top: 10px;
  width: 4px; height: 4px; border-radius: 50%; background: var(--primary);
}
/* ===== Scene Factor Card ===== */
.factor-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.factor-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px; background: var(--bg); border-radius: var(--radius-md);
}
.factor-item .factor-label { font-size: 13px; color: var(--text); }
.factor-item .factor-weight { font-size: 13px; font-weight: 600; color: var(--primary); }
.factor-bar-row { margin-bottom: 6px; }
.factor-bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 2px; }
.factor-bar-label .name { color: var(--text-secondary); }
.factor-bar-label .pct { color: var(--text-muted); }
.factor-bar { height: 6px; background: var(--divider); border-radius: 3px; overflow: hidden; }
.factor-bar-fill { height: 100%; background: var(--primary); border-radius: 3px; }
.factor-pool { display: flex; flex-wrap: wrap; gap: 4px; }
.factor-pool-tag {
  padding: 3px 8px; border-radius: var(--radius-xs);
  background: var(--bg); color: var(--text-muted); font-size: 11px;
}
/* ===== Report Overview Card ===== */
.report-header-info { margin-bottom: 12px; }
.report-module {
  border: 1px solid var(--divider); border-radius: var(--radius-md);
  margin-bottom: 8px; overflow: hidden;
}
.report-module-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; cursor: pointer; background: var(--bg);
}
.report-module-title { font-size: 13px; font-weight: 600; color: var(--text); }
.report-module-toggle { font-size: 12px; color: var(--primary); }
.report-module-body {
  display: none; padding: 10px 14px; font-size: 12px;
  color: var(--text-secondary); line-height: 1.8; background: var(--card-bg);
}
.report-module.expanded .report-module-body { display: block; }
.report-module.expanded .report-module-toggle::after { content: " ▲"; }
.report-module-toggle::after { content: " ▼"; }
/* ===== Enhanced Report Module Styles ===== */
.report-module .indicator-grid { margin-bottom: 8px; }
.report-module .basic-info-box { margin-bottom: 0; }
.report-module .risk-badge-large { padding: 14px; margin-bottom: 8px; }
.report-module .risk-badge-large .risk-label { font-size: 18px; }
.report-module .risk-badge-large .risk-score { font-size: 26px; }
.report-module .score-detail { margin-bottom: 8px; }
.report-module .advice-list li { font-size: 12px; }
.risk-indicator-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--divider); }
.risk-indicator-row:last-child { border-bottom: none; }
.risk-indicator-name { font-size: 13px; color: var(--text-secondary); width: 60px; flex-shrink: 0; }
.risk-indicator-score { font-size: 14px; font-weight: 600; width: 32px; text-align: center; }
.risk-indicator-bar { flex: 1; height: 6px; background: var(--divider); border-radius: 3px; overflow: hidden; }
.risk-indicator-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.risk-indicator-status { font-size: 11px; font-weight: 500; width: 28px; text-align: right; }
.score-breakdown { background: var(--bg); border-radius: var(--radius-md); padding: 10px 14px; margin: 8px 0; }
.score-breakdown-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 4px 0; }
.score-breakdown-row .sbl { color: var(--text-muted); }
.score-breakdown-row .sbv { font-weight: 600; color: var(--text); }
.score-breakdown-row.total-row { border-top: 1px dashed var(--divider); margin-top: 4px; padding-top: 8px; }
.score-breakdown-row.total-row .sbv { font-size: 18px; font-weight: 700; color: var(--primary); }
.advice-category-tag { display: inline-block; padding: 2px 8px; border-radius: var(--radius-xs); background: var(--primary-light); color: var(--primary); font-size: 11px; font-weight: 500; margin-bottom: 6px; }
/* ===== Enhanced Risk Overview Sections ===== */
.risk-section {
  background: var(--bg); border-radius: var(--radius-md);
  padding: 12px 14px; margin-bottom: 10px;
}
.risk-section-title {
  font-size: 13px; font-weight: 600; color: var(--text);
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.risk-section-title .rs-icon { width: 16px; height: 16px; color: var(--primary); flex-shrink: 0; }
.risk-section-title .rs-count {
  font-size: 11px; color: var(--text-muted); font-weight: 400; margin-left: auto;
}
.disease-risk-row {
  display: flex; align-items: center; gap: 8px; padding: 5px 0;
  border-bottom: 1px solid var(--divider); font-size: 13px;
}
.disease-risk-row:last-child { border-bottom: none; }
.disease-risk-name { color: var(--text-secondary); flex-shrink: 0; width: 90px; }
.disease-risk-bar { flex: 1; height: 5px; background: var(--divider); border-radius: 3px; overflow: hidden; }
.disease-risk-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.disease-risk-score { font-size: 12px; font-weight: 600; width: 50px; text-align: right; flex-shrink: 0; }
.disease-risk-level {
  font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 600; flex-shrink: 0;
}
.disease-risk-level.high { background: var(--risk-4-bg); color: var(--risk-4); }
.disease-risk-level.mid { background: var(--risk-2-bg); color: var(--risk-2); }
.disease-risk-level.low { background: var(--risk-0-bg); color: var(--risk-0); }
.constitution-mini-row {
  display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px;
}
.constitution-mini-name { color: var(--text-secondary); width: 60px; flex-shrink: 0; }
.constitution-mini-bar { flex: 1; height: 5px; background: var(--divider); border-radius: 3px; overflow: hidden; }
.constitution-mini-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.constitution-mini-score { font-size: 12px; font-weight: 600; width: 32px; text-align: right; color: var(--text-muted); flex-shrink: 0; }
.constitution-mini-row.primary .constitution-mini-name { color: var(--primary); font-weight: 600; }
.constitution-mini-row.primary .constitution-mini-score { color: var(--primary); }
.syndrome-box {
  background: var(--primary-light); border-radius: var(--radius-sm);
  padding: 8px 12px; font-size: 12px; color: var(--text-secondary); line-height: 1.7;
}
.syndrome-box .syndrome-name { font-size: 13px; font-weight: 600; color: var(--primary); display: block; margin-bottom: 2px; }
.care-summary-grid {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.care-summary-item {
  display: flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: var(--radius-xs);
  background: var(--card-bg); border: 1px solid var(--divider);
  font-size: 12px; color: var(--text-secondary);
}
.care-summary-item .csi-label {
  font-size: 11px; color: var(--primary); font-weight: 600; flex-shrink: 0;
}
.detail-report-btn {
  width: 100%; padding: 10px 16px; border-radius: var(--radius-md);
  border: 1px solid var(--primary); background: var(--primary); color: #fff;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  margin-top: 10px;
}
.detail-report-btn:hover { background: var(--primary-hover); }
.detail-report-btn svg { width: 16px; height: 16px; }
/* ===== Help Card ===== */
.help-list { list-style: none; }
.help-list li {
  position: relative; padding-left: 22px; font-size: 13px;
  color: var(--text-secondary); line-height: 2;
}
.help-list li::before {
  content: "✓"; position: absolute; left: 0; top: 0;
  color: var(--primary); font-weight: 700; font-size: 14px;
}
/* ===== Risk Level Card ===== */
.risk-level-table { width: 100%; border-collapse: collapse; }
.risk-level-table th, .risk-level-table td {
  padding: 8px 6px; text-align: center; font-size: 12px;
  border-bottom: 1px solid var(--divider);
}
.risk-level-table th { color: var(--text-muted); font-weight: 600; }
.risk-level-table .level-badge {
  display: inline-block; padding: 2px 8px; border-radius: var(--radius-xs);
  font-size: 11px; font-weight: 600; color: #fff;
}
/* ===== Input Bar ===== */
.input-bar {
  height: var(--input-h); background: var(--card-bg);
  border-top: 1px solid var(--divider); display: flex;
  align-items: center; gap: 8px; padding: 0 16px; flex-shrink: 0;
}
.input-bar input {
  flex: 1; height: 40px; padding: 0 14px; border: 1px solid var(--border);
  border-radius: var(--radius-md); font-size: 14px; outline: none;
  background: var(--bg); color: var(--text); transition: border-color 0.2s;
}
.input-bar input:focus { border-color: var(--primary); }
.input-bar input::placeholder { color: var(--text-muted); }
.voice-btn, .send-btn {
  width: 40px; height: 40px; border: none; border-radius: var(--radius-md);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; flex-shrink: 0;
}
.voice-btn { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); }
.voice-btn:hover { border-color: var(--primary); color: var(--primary); }
.voice-btn.recording { background: var(--primary); color: #fff; border-color: var(--primary); animation: voicePulse 1.2s infinite; }
.voice-btn svg { width: 18px; height: 18px; }
@keyframes voicePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,107,53,0.4); } 50% { box-shadow: 0 0 0 8px rgba(255,107,53,0); } }
.send-btn { background: var(--primary); color: #fff; }
.send-btn:hover { background: var(--primary-hover); }
.send-btn:active { transform: scale(0.95); }
.send-btn svg { width: 18px; height: 18px; }
/* ===== Elderly Picker ===== */
.picker-overlay {
  position: fixed; inset: 0; background: rgba(30,27,75,0.45);
  z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.picker-overlay.show { opacity: 1; pointer-events: auto; }
.elderly-picker {
  position: fixed; bottom: 0; left: 50%;
  transform: translateX(-50%) translateY(100%);
  width: var(--container-w); max-width: 100vw; max-height: 70vh;
  background: var(--card-bg); border-radius: var(--radius-xl) var(--radius-xl) 0 0;

function renderTemplate(tpl, data) {
  if (!tpl) return '';
  if (!data) data = {};
  var r = tpl.replace(/\{\{(\w[\w.]*)\|([^}]*)\}\}/g, function(m, key, dflt) {
    var val = getNested(data, key);
    return (val !== undefined && val !== null && val !== '') ? String(val) : dflt;
  });
  r = r.replace(/\{\{#(\w+)\}\}([\s\S]*?)\{\{\/\1\}\}/g, function(m, key, body) {
    var val = data[key];
    if (!val) return '';
    if (Array.isArray(val)) return val.map(function(item){return renderBlock(body,item);}).join('');
    if (typeof val === 'object' && val !== null) return renderBlock(body, val);
    if (val) return body; return '';
  });
  r = r.replace(/\{\{\^(\w+)\}\}([\s\S]*?)\{\{\/\1\}\}/g, function(m, key, body) {
    var val = data[key];
    if (!val || (Array.isArray(val) && val.length === 0)) return body;
    return '';
  });
  r = r.replace(/\{\{\.\}\}/g, function(m) { return String(data.__current__ || ''); });
  r = r.replace(/\{\{(\w[\w.]*)\}\}/g, function(m, key) {
    var val = getNested(data, key);
    return (val !== undefined && val !== null && val !== '') ? String(val) : m;
  });
  return r;
}
function getNested(obj, path) {
  var parts = path.split('.'); var cur = obj;
  for (var i=0;i<parts.length;i++) { if(cur===null||cur===undefined)return undefined; cur=cur[parts[i]]; }
  return cur;
}
function renderBlock(body, item) {
  item.__current__ = item;
  var r = body.replace(/\{\{(\w[\w.]*)\|([^}]*)\}\}/g,function(m,k,d){var v=getNested(item,k);return(v!==undefined&&v!==null&&v!=='')?String(v):d;});
  r=r.replace(/\{\{#(\w+)\}\}([\s\S]*?)\{\{\/\1\}\}/g,function(m,k,b){var v=item[k];if(!v)return'';if(Array.isArray(v))return v.map(function(it){return renderBlock(b,it);}).join('');if(typeof v==='object'&&v!==null)return renderBlock(b,v);if(v)return b;return '';});
  r=r.replace(/\{\{\^(\w+)\}\}([\s\S]*?)\{\{\/\1\}\}/g,function(m,k,b){var v=item[k];if(!v||(Array.isArray(v)&&v.length===0))return b;return '';});
  r=r.replace(/\{\{\.\}\}/g,function(m){return String(item.__current__||'');});

  delete item.__current__; return r;
}

function calculateSceneWeight(elderlyProfile, sceneFactors) {
  let weight = 0; const ep = elderlyProfile;
  if (sceneFactors.includes('age_70_79') && ep.age >= 70 && ep.age < 80) weight += 0.75;
  if (sceneFactors.includes('age_80_plus') && ep.age >= 80) weight += 1.50;
  if (sceneFactors.includes('dementia_mild') && ep.dementiaLevel === '轻度') weight += 0.75;
  if (sceneFactors.includes('dementia_severe') && ep.dementiaLevel === '中重度') weight += 1.50;
  if (sceneFactors.includes('disability_mild') && ep.disabilityLevel === '轻度') weight += 0.50;
  if (sceneFactors.includes('disability_moderate') && ep.disabilityLevel === '中度') weight += 1.00;
  if (sceneFactors.includes('disability_severe') && ep.disabilityLevel === '重度') weight += 1.50;
  return Math.min(3.75, weight);
}

function buildTongueIndicators(tongueReport) {

    { name: '苔色', value: tongueReport.tongueCoating || '未知', abnormal: !normalTongueCoating.includes(tongueReport.tongueCoating) },
    { name: '舌体', value: tongueReport.tongueBody || '未知', abnormal: !normalTongueBody.includes(tongueReport.tongueBody) },

    { name: '脉象', value: tongueReport.pulseType || '未知', abnormal: !normalPulseType.includes(tongueReport.pulseType) },
    { name: '面色', value: tongueReport.faceComplexion || '未知', abnormal: !normalFaceComplexion.includes(tongueReport.faceComplexion) }
  ];
}
function calculateBaseScore(indicators, minTriggerCount) {
  if (!indicators || indicators.length === 0) return 0;
  const validIndicators = indicators.filter(i => i.value !== null && i.value !== undefined && i.value !== '未知');
  if (validIndicators.length < minTriggerCount) return 0;
  const abnormalCount = validIndicators.filter(i => i.abnormal).length;
  return Math.min(10, abnormalCount * 2.5);
}
function normalizeRiskLevel(score) {
  if (score < 2) return 0; if (score < 4) return 1;
  if (score < 6) return 2; if (score < 8) return 3; return 4;

function calculateCompositeRisk(params) {
  const { elderlyProfile, tongueReport } = params;

  if (!tongueReport.tongueColor || !tongueReport.tongueCoating || !tongueReport.tongueBody || !tongueReport.pulseType || !tongueReport.faceComplexion)
    return { error: true, message: '舌诊报告数据不完整，需包含舌色、苔色、舌体、脉象、面色等结构化数据' };
  const rule = DIMENSION_RULE;
  const indicators = buildTongueIndicators(tongueReport);
  const baseScore = calculateBaseScore(indicators, rule.minTriggerCount);
  const sceneWeight = calculateSceneWeight(elderlyProfile, rule.sceneFactors);
  const finalScore = Math.min(10, Math.max(0, baseScore + sceneWeight));
  const riskLevel = normalizeRiskLevel(finalScore);
  const dimensionResult = {
    dimensionId: rule.id, dimensionName: rule.name, riskLevel: riskLevel,
    riskLabel: RISK_LEVELS[riskLevel].label, baseScore: baseScore, sceneWeight: sceneWeight,
    finalScore: finalScore, triggerIndicators: indicators.filter(i => i.abnormal).map(i => i.name),
    detail: rule.conclusionTemplates[riskLevel],

    // 结构化舌诊数据（替代原tongueDesc/faceDesc/pulseDesc）

    tongueBody: tongueReport.tongueBody, sublingualVein: tongueReport.sublingualVein,
    tongueSummary: tongueReport.tongueSummary || '',

    pulseInterpretation: tongueReport.pulseInterpretation || '',
    faceComplexion: tongueReport.faceComplexion, faceInterpretation: tongueReport.faceInterpretation || ''
  };
  return {
    error: false,
    reportCode: 'TCM-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + String(Math.floor(Math.random()*9999)+1).padStart(4,'0'),

  };

function checkSpecialInput(input) {
  const text = input.trim();
  // 收集所有姓名匹配的老人
  const matched = MOCK_DATA.filter(d => text.includes(d.profile.name));
  if (matched.length === 1) return { type: 'switchByName', elderlyId: matched[0].profile.id };
  if (matched.length > 1) {
    return {
      type: 'duplicateName',
      name: matched[0].profile.name,
      candidates: matched.map(d => ({ profile: d.profile }))
    };
  }
  const num = parseInt(text);
  if (num >= 1 && num <= MOCK_DATA.length && text === String(num)) return { type: 'switchByNumber', elderlyId: num };
  return null;
}
function matchIntent(input) {
  const text = input.trim().toLowerCase();
  let bestMatch = null, bestScore = 0;
  for (const rule of INTENT_RULES) {
    let score = 0;
    for (const keyword of rule.keywords) {
      if (text.includes(keyword.toLowerCase())) { score += keyword.length >= 3 ? 3 : 2; if (text === keyword.toLowerCase()) score += 5; }
    }
    if (score > 0) score += rule.priority;
    if (score > bestScore) { bestScore = score; bestMatch = rule; }
  }
  if (!bestMatch || bestScore < 2) return { intent: 'fallback', response: '抱歉，我暂时无法理解您的问题。您可以试着问我「查看总评」「有什么风险」「查看建议」或「生成报告」。', cardType: null, quickReplies: [] };
  return bestMatch;
}

function renderIndicatorDetailCard(data) {
  const dim = data.dimension;
  const tr = data.tongueReport;

    return '<div class="indicator-cell ' + (ind.abnormal ? 'abnormal' : 'normal') + '">' +
      '<div class="ind-name">' + ind.name + '</div>' +
      '<div class="ind-value">' + (ind.value || '未知') + '</div>' +
      '<div class="ind-status"><span class="ind-status-dot"></span>' + (ind.abnormal ? '异常' : '正常') + '</div></div>';
  }).join('');

    structuredDescHtml = '<div class="tongue-detail-grid">' +

      (dim.faceInterpretation ? '<div class="td-item"><span class="td-label">面诊解读</span><span class="td-value">' + dim.faceComplexion + '，' + dim.faceInterpretation + '</span></div>' : '') +
      '</div>';
  }

    }).join('') + '</div>';
  }
  return '<div class="card-message">' +
    '<div class="card-header">' + SVG_ICONS.detail + ' 中医体质与证型风险详情</div>' +
    '<div class="card-body">' +
    '<div class="indicator-grid">' + cells + '</div>' +
    structuredDescHtml +
    '<div class="section-label">中医证候</div>' + syndromeHtml +
    '<div class="section-label">体质辨识</div>' + constitutionHtml +
    '<div class="section-label">维度结论</div>' +

function renderCareAdviceCard(data) {
  const tr = data.tongueReport;
  let groupsHtml = '<div style="font-size:13px;color:var(--text-muted);">暂无个性化调理数据</div>';
  if (tr && tr.personalizedCare) {
    const care = tr.personalizedCare;
    const contra = tr.contraindications || {};
    const sections = [];
    if (care.herbalFormulas && care.herbalFormulas.length > 0) {
      sections.push('<div class="advice-group"><div class="advice-group-title"><span class="dot"></span>中药调理</div><ul class="advice-list">' + care.herbalFormulas.map(item => '<li>' + item + '</li>').join('') + '</ul></div>');
    }
    if (care.acupoints && care.acupoints.length > 0) {
      sections.push('<div class="advice-group"><div class="advice-group-title"><span class="dot"></span>穴位保健</div><ul class="advice-list">' + care.acupoints.map(item => '<li>' + item + '</li>').join('') + '</ul></div>');
    }
    if (care.dietary && care.dietary.length > 0) {
      sections.push('<div class="advice-group"><div class="advice-group-title"><span class="dot"></span>膳食调理</div><ul class="advice-list">' + care.dietary.map(item => '<li>' + item + '</li>').join('') + '</ul></div>');
    }
    if (care.exercise && care.exercise.length > 0) {
      sections.push('<div class="advice-group"><div class="advice-group-title"><span class="dot"></span>运动建议</div><ul class="advice-list">' + care.exercise.map(item => '<li>' + item + '</li>').join('') + '</ul></div>');
    }
    const contraItems = [];
    if (contra.diet) contraItems.push(...contra.diet.map(d => '饮食：' + d));
    if (contra.lifestyle) contraItems.push(...contra.lifestyle.map(d => '生活：' + d));
    if (contra.medication) contraItems.push(...contra.medication.map(d => '用药：' + d));
    if (contraItems.length > 0) {
      sections.push('<div class="advice-group"><div class="advice-group-title"><span class="dot" style="background:var(--risk-3)"></span>禁忌提醒</div><ul class="advice-list">' + contraItems.map(item => '<li>' + item + '</li>').join('') + '</ul></div>');
    }
    groupsHtml = sections.join('<div style="height:8px;"></div>');
  }
  return '<div class="card-message">' +
    '<div class="card-header">' + SVG_ICONS.advice + ' 个性化调理方案</div>' +
    '<div class="card-body">' + groupsHtml + renderCardActions(['查看总评','查看详情']) + '</div></div>';
}

function typeWriter(element, text, speed, callback) {
  state.isTyping = true; let index = 0;
  element.textContent = '';
  function type() {
    if (index < text.length) {
      element.textContent += text.charAt(index); index++; scrollToBottom();
      const delay = speed + Math.random() * 20 - 10;
      setTimeout(type, delay);
    } else { state.isTyping = false; if (callback) callback(); }
  }
  type();
}
function escapeHtml(text) {

// 解析重名确认场景下用户输入的序号选择
function checkDuplicateSelection(input) {
  if (!state.pendingDuplicate) return null;
  const text = input.trim();
  // 支持"第X位"、"第X个"、"第一位"、"第一个"、纯数字等表达
  const patterns = [
    /第([一二三四五六七八九十\d]+)位/,
    /第([一二三四五六七八九十\d]+)个/,
    /第([一二三四五六七八九十\d]+)/,
    /^([一二三四五六七八九十\d]+)$/
  ];
  const numMap = { '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9, '十':10 };
  for (const pattern of patterns) {
    const m = text.match(pattern);
    if (m) {
      let num = numMap[m[1]] || parseInt(m[1]);
      if (!isNaN(num) && num >= 1 && num <= state.pendingDuplicate.candidates.length) {
        return { index: num - 1 };
      }
    }
  }
  return null;
}
function handleUserInput(text) {
  // 检查是否处于重名确认待选状态
  if (state.pendingDuplicate) {
    // 尝试解析用户输入的序号选择
    var selection = checkDuplicateSelection(text);
    if (selection) {
      selectDuplicateElderly(selection.index);
      return;
    }
    // 用户输入了其他内容，清除待选状态，走正常流程
    state.pendingDuplicate = null;
  }
  const special = checkSpecialInput(text);
  if (special) {
    // 重名场景：输出确认卡片
    if (special.type === 'duplicateName') {
      state.pendingDuplicate = special;
      addAIMessage('检测到 ' + special.candidates.length + ' 位同名老人「' + special.name + '」，请确认是哪一位：', 'duplicateConfirmCard', special, () => {
        updateQuickReplies([]);
      });
      return;
    }
    // 正常切换（唯一匹配或数字切换）
    const data = MOCK_DATA.find(d => d.profile.id === special.elderlyId);
    switchElderly(special.elderlyId);
    const report = getCurrentReport();
    addAIMessage('已切换到' + data.profile.name + '（' + data.profile.age + '岁），正在分析最新舌诊报告...', 'riskOverviewCard', report, () => {
      updateQuickReplies(['查看详情','查看建议','生成报告']);
    });
    return;
  }
  const match = matchIntent(text);
  if (match.action === 'openPicker') {
    addAIMessage('请选择要查看的老人：', null, null, () => {
      openElderlyPicker();
      updateQuickReplies(match.quickReplies);
    });
    return;
  }
  const report = getCurrentReport();
  const elderlyName = getCurrentElderly().profile.name;
  let responseText = '';
  if (report.error) { responseText = report.message; }
  else {
    switch(match.intent) {
      case 'viewOverview': responseText = '以下是为' + elderlyName + '老人生成的综合风险总评：'; break;
      case 'viewDetail': responseText = '这是' + elderlyName + '老人的中医体质与证型风险详情：'; break;
      case 'viewAdvice': responseText = '根据' + elderlyName + '老人的风险等级，以下是结构化康养建议：'; break;
      case 'viewIndicators': responseText = '以下是' + elderlyName + '老人的各项指标评分数据：'; break;
      case 'generateReport': responseText = '已为' + elderlyName + '老人生成完整风险评估报告，包含8大模块：'; break;
      case 'viewRiskLevels': responseText = '健康风险评估系统采用5级风险分级标准：'; break;
      case 'viewRiskPoints': responseText = '以下是为' + elderlyName + '老人生成的综合风险总评：'; break;
      case 'help': responseText = '我是健康风险评估师AI助手，可以帮您：'; break;
      default: responseText = match.response;
    }
  }
  const cardType = report.error ? null : match.cardType;
  const cardData = report.error ? null : report;
  addAIMessage(responseText, cardType, cardData, () => {
    updateQuickReplies(match.quickReplies);
  });
}

let recognition = null;
let isRecording = false;
function toggleVoiceInput() {
  const input = document.getElementById('chatInput');
  const btn = document.getElementById('voiceBtn');
  if (isRecording) {
    if (recognition) recognition.stop();
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    addAIMessage('抱歉，您的浏览器暂不支持语音识别功能，请使用文字输入。', null, null, null);
    return;
  }
  recognition = new SR();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = true;
  let finalText = '';
  recognition.onstart = function() {
    isRecording = true;
    btn.classList.add('recording');
    input.placeholder = '正在聆听...请说话';
  };
  recognition.onresult = function(event) {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
      else interim += event.results[i][0].transcript;
    }
    input.value = finalText + interim;
  };
  recognition.onerror = function(event) {
    isRecording = false;
    btn.classList.remove('recording');
    input.placeholder = '输入或语音说出您的问题...';
    if (event.error === 'not-allowed') {
      addAIMessage('请允许浏览器使用麦克风权限后重试。', null, null, null);
    }
  };
  recognition.onend = function() {
    isRecording = false;
    btn.classList.remove('recording');
    input.placeholder = '输入或语音说出您的问题...';
    if (finalText.trim()) {
      sendMessage();
    }
  };
  recognition.start();
}

// 舌诊指标是否正常的辅助判断
function isNormalTongue(val, type) {
  if (!val) return false;
  var normalMap = {
    color: ['淡红','红润'],
    coating: ['薄白'],
    body: ['正常','适中'],
    pulse: ['平和','有力'],
    face: ['红润','正常']
  };
  var normals = normalMap[type] || [];
  return normals.indexOf(val) >= 0;
}

// 将 tpl-scope-styles 作用域化样式反向还原为预览版原生的 :root 变量 + 组件类
function getNativeTplCss() {
  var el = document.getElementById('tpl-scope-styles');
  if (!el) return '';
  var css = el.textContent;
  css = css.replace(/\.tpl-scope\s*\{/g, ':root {');
  css = css.replace(/\.tpl-scope\s+\*\s*\{/g, '* {');
  css = css.replace(/\.tpl-scope\s+(img|a|ul|ol|li|body|html|table|tr|td|th|p|span|div|h[1-6]|button|svg|path|small|strong|em|section|article|header|footer|nav)\b/g, '$1');
  css = css.replace(/\.tpl-scope\s+\./g, '.');
  css = css.replace(/\.tpl-scope/g, '');
  return css;
}

function exportReport(tplId, useElderlyData, rawHtml) {
  // rawHtml 模式：直接导出已渲染好的 HTML（用于老人卡片等场景，不经过模板渲染）
  if (rawHtml) {
    var elderlyName = (function(){
      try {
        var m = rawHtml.match(/姓名：\s*(\S+)/) || rawHtml.match(/name.*?>([^<]+)</);
        return m ? m[1] : '报告';
      } catch(e) { return '报告'; }
    })();
    var nativeCss = getNativeTplCss();
    var baseCss = 'html{-webkit-text-size-adjust:100%;}' +
      'body{font-family:var(--font-sans);background:var(--n0);color:var(--n800);font-size:16px;line-height:1.6;padding:12px;overflow-wrap:anywhere;word-break:break-word;-webkit-font-smoothing:antialiased;}';
    var fullHtml = '<!DOCTYPE html><html lang="zh-CN" data-layout="vertical"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>健康报告 - ' + elderlyName + '</title>' +
      '<style>' + baseCss + nativeCss + '</style>' +
      '</head><body><div class="card" data-layout="vertical">' + rawHtml + '</div></body></html>';
    var blob = new Blob([fullHtml], {type: 'text/html;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = '健康报告_' + elderlyName + '_' + Date.now() + '.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    return;
  }
  // 模板渲染模式：用指定模板 + 数据渲染后导出
  tplId = tplId || state_selectedTpl || 'health_report_card';
  var tplEl = document.getElementById('tpl_' + tplId);
  if (!tplEl) { alert('报告模板未加载: ' + tplId); return; }
  var tpl = tplEl.textContent || tplEl.innerText || '';
  // 模板内嵌时 </ 被转义为 <\/ 防止提前结束 script，需还原
  if (tpl.indexOf('<\\/') >= 0) { tpl = tpl.split('<\\/').join('</'); }
  // useElderlyData=true 用当前老人真实数据（buildReportTemplateData），否则用模板自带示例数据
  var tplData = useElderlyData ? buildReportTemplateData() : (TPL_DATA[tplId] || buildReportTemplateData());
  var html = renderTemplate(tpl, tplData);
  // 复用预览版样式：原生 :root 变量 + html/body 全局重置（作用域化时剥离，此处补回）
  var nativeCss = getNativeTplCss();
  var baseCss = 'html{-webkit-text-size-adjust:100%;}' +
    'body{font-family:var(--font-sans);background:var(--n0);color:var(--n800);font-size:16px;line-height:1.6;padding:12px;overflow-wrap:anywhere;word-break:break-word;-webkit-font-smoothing:antialiased;}';
  // 预览版的卡片根结构是 <div class="card" data-layout="vertical">（模板自带内容包进去）
  var cardHtml = (html.trim().indexOf('<div class="card"') === 0)
    ? html
    : '<div class="card" data-template="' + tplId + '" data-layout="vertical">' + html + '</div>';
  // 构建完整可独立打开的 HTML（与 preview/*.preview.html 同款）
  var fullHtml = '<!DOCTYPE html><html lang="zh-CN" data-layout="vertical"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>健康风险评估报告 - ' + (tplData.name || tplId) + '</title>' +
    '<style>' + baseCss + nativeCss + '</style>' +
    '</head><body>' + cardHtml + '</body></html>';
  var blob = new Blob([fullHtml], {type: 'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = '健康报告_' + (tplData.name || tplId) + '_' + Date.now() + '.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
}


// ==================== 导出当前老人卡片（直接导出已渲染的 HTML） ====================
function exportCurrentElderlyCard(btn) {
  var cardBody = btn.closest('.card-body');
  if (!cardBody) { alert('找不到报告内容'); return; }
  // 克隆内容并移除操作按钮（导出/查看详情等），只保留报告数据
  var temp = document.createElement('div');
  temp.innerHTML = cardBody.cloneNode(true).innerHTML;
  var btns = temp.querySelectorAll('.export-btn,.detail-report-btn,.card-actions');
  btns.forEach(function(b){ b.remove(); });
  exportReport(null, null, temp.innerHTML);
}
